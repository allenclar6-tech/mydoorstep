services:
  - type: web
    name: mydoorstep-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 4000
      - key: WEB_ORIGIN
        value: https://mydoorstep-web.onrender.com
      - key: WEB_ORIGINS
        value: https://mydoorstep-site-20260922.eyedofejiro10.workers.dev
      - key: NEXT_PUBLIC_APP_URL
        value: https://mydoorstep-web.onrender.com
      - key: PAYMENT_CALLBACK_URL
        value: https://mydoorstep-web.onrender.com/payment/callback
      - key: DATABASE_URL
        fromDatabase:
          name: mydoorstep-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: VERIFICATION_FROM_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SMS_PROVIDER
        value: twilio
      - key: PRIVATE_UPLOAD_DIR
        value: /tmp/private-uploads

  - type: web
    name: mydoorstep-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mydoorstep-api.onrender.com

databases:
  - name: mydoorstep-db
    databaseName: doorstep
    user: doorstep
