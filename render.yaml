services:
  - type: web
    name: mydoorstep-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    disk:
      name: private-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: 4000
      - key: WEB_ORIGIN
        value: https://mydoorstep.com.co
      - key: WEB_ORIGINS
        value: https://mydoorstep-web.onrender.com,https://mydoorstep-site-20260922.eyedofejiro10.workers.dev
      - key: NEXT_PUBLIC_APP_URL
        value: https://mydoorstep-web.onrender.com
      - key: PAYMENT_CALLBACK_URL
        value: https://mydoorstep.com.co/payment/callback
      - key: DATABASE_URL
        fromDatabase:
          name: mydoorstep-db
          property: connectionString
      - key: AUTH_SECRET
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_NAVIGATION_API_KEY
        sync: false
      - key: MAPBOX_SERVER_TOKEN
        sync: false
      - key: CARD_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: PAYSTACK_TRANSFERS_ENABLED
        value: "false"
      - key: VERIFICATION_FROM_EMAIL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SMS_PROVIDER
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: TERMII_CHANNEL
        value: dnd
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_AUTH_TEMPLATE
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NINJA_SECRET_KEY
        sync: false
      - key: MAPBOX_PUBLIC_TOKEN
        sync: false
      - key: PRIVATE_UPLOAD_DIR
        value: /var/data/private-uploads

  - type: web
    name: mydoorstep-web
    runtime: docker
    dockerfilePath: ./Dockerfile.web
    envVars:
      - key: VITE_API_BASE_URL
        value: https://mydoorstep-api.onrender.com
      - key: VITE_MAP_PUBLIC_TOKEN
        sync: false

databases:
  - name: mydoorstep-db
    databaseName: doorstep
    user: doorstep
