<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f6f7f2" />
    <meta name="description" content="DOORSTEP delivers food, groceries and more across Delta, Edo and Rivers States, Nigeria." />
    <link rel="icon" type="image/svg+xml" href="/doorstep-icon.svg?v=3" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="DOORSTEP" />
    <script>
      // Two installable apps from one site: /admin pages install as "DOORSTEP Admin", everything else as DOORSTEP.
      if (location.pathname === '/admin' || location.pathname.indexOf('/admin/') === 0) {
        document.querySelector('link[rel="manifest"]').href = '/admin.webmanifest?v=1'
        document.querySelector('link[rel="apple-touch-icon"]').href = '/icons/admin-apple-touch-icon.png?v=1'
        document.querySelector('meta[name="apple-mobile-web-app-title"]').content = 'DS Admin'
        document.querySelector('meta[name="theme-color"]').content = '#0e4f3c'
        document.title = 'DOORSTEP Admin'
        document.documentElement.className += ' is-admin-app'
      }
    </script>
    <title>DOORSTEP — Good food, closer to home</title>
    <style>
      /* Opening screen (like Glovo): DOORSTEP yellow with the logo while the app starts. Removed by src/main.jsx. */
      #ds-splash { align-items: center; background: #ffc244; display: flex; flex-direction: column; gap: 18px; inset: 0; justify-content: center; position: fixed; transition: opacity .35s ease, visibility .35s; z-index: 2147483000; animation: ds-splash-out .4s 8s forwards; }
      #ds-splash.is-done { opacity: 0; visibility: hidden; }
      .ds-splash-mark { animation: ds-pop .55s cubic-bezier(.2, .9, .3, 1.3) both; border-radius: 30px; box-shadow: 0 18px 40px rgba(18, 61, 45, .28); display: block; height: 104px; width: 104px; }
      .ds-splash-word { animation: ds-rise .5s .12s both; color: #123d2d; font: 900 28px/1 Manrope, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; letter-spacing: .06em; }
      .ds-splash-dots { display: flex; gap: 7px; margin-top: 6px; }
      .ds-splash-dots i { animation: ds-dot 1s ease-in-out infinite; background: #123d2d; border-radius: 50%; display: block; height: 8px; opacity: .25; width: 8px; }
      .ds-splash-dots i:nth-child(2) { animation-delay: .15s; } .ds-splash-dots i:nth-child(3) { animation-delay: .3s; }
      .is-admin-app #ds-splash { background: #0e4f3c; } .is-admin-app .ds-splash-word { color: #fff; } .is-admin-app .ds-splash-dots i { background: #fff; }
      @keyframes ds-pop { from { opacity: 0; transform: scale(.6); } }
      @keyframes ds-rise { from { opacity: 0; transform: translateY(10px); } }
      @keyframes ds-dot { 50% { opacity: 1; transform: translateY(-4px); } }
      @keyframes ds-splash-out { to { opacity: 0; visibility: hidden; } }
      @media (prefers-reduced-motion: reduce) { #ds-splash, #ds-splash * { animation-duration: .01s !important; animation-iteration-count: 1 !important; } #ds-splash { animation-delay: 8s !important; } }
    </style>
  </head>
  <body>
    <div id="ds-splash" aria-hidden="true">
      <svg class="ds-splash-mark" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"><rect width="64" height="64" rx="18" fill="#123d2d"/><path d="M32.00 47.92L21.04 36.96A15.50 15.50 0 1 1 42.96 36.96Z" fill="#fffdf7"/><circle cx="32" cy="26" r="5.6" fill="#ffc244"/></svg>
      <span class="ds-splash-word">DOORSTEP</span>
      <span class="ds-splash-dots"><i></i><i></i><i></i></span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
