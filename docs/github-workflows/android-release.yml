# Builds the DOORSTEP Android app (a Trusted Web Activity: your live website as a real Android app), signs it with
# YOUR key, and publishes it — free. Run it from GitHub → Actions → "Android app" → Run workflow.
#
# One-time setup (see android/README.md): add these repository secrets in GitHub → Settings → Secrets → Actions:
#   ANDROID_KEYSTORE_BASE64   your android.keystore file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD the keystore password
#   ANDROID_KEY_PASSWORD      the key password (often the same)
# The signing key never goes into the repository and is never printed in the logs.
#
# Where the APK is published:
#   public repository  → GitHub Releases (free HTTPS download from github.com)
#   private repository → GitHub Releases (your private archive) AND public/downloads/ on mydoorstep.com.co,
#                        because files on a private repo's releases can't be downloaded by the public.
# Either way it writes public/app-release.json (version, date, size, SHA-256, link) for the /download page and
# public/assetlinks.json (proves to Android that the app and the website belong together), then commits them.
# Deploy the website afterwards so the download page shows the new version.

name: Android app

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version people see, e.g. 1.0.0 (must be new each time)'
        required: true
        default: '1.0.0'
      notes:
        description: 'What changed in this version (shown on the download page)'
        required: false
        default: 'First Android release of DOORSTEP.'

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      VERSION_CODE: ${{ github.run_number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check the version looks right
        run: |
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "::error::Version must look like 1.0.0"; exit 1; fi
          if gh release view "android-v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "::error::android-v$VERSION already exists. Use a new version number."; exit 1; fi

      - name: Check the signing secrets are set
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KS" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KS_PW" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_PW" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Add these repository secrets first:$missing (see android/README.md)"; exit 1; fi

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap (Google's official TWA builder)
        run: npm install --global @bubblewrap/cli@1

      - name: Prepare the Android project
        working-directory: android
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KS" | base64 --decode > android.keystore
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          jq --arg v "$VERSION" --argjson c "$VERSION_CODE" '.appVersionName = $v | .appVersion = $v | .appVersionCode = $c' twa-manifest.json > twa.tmp && mv twa.tmp twa-manifest.json
          yes | bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build and sign the APK and AAB
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          test -s app-release-signed.apk
          test -s app-release-bundle.aab

      - name: Checksums and the app's signing fingerprint
        id: info
        working-directory: android
        env:
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p ../out
          cp app-release-signed.apk "../out/DOORSTEP-$VERSION.apk"
          cp app-release-bundle.aab "../out/DOORSTEP-$VERSION.aab"
          cd ../out
          sha256sum "DOORSTEP-$VERSION.apk" "DOORSTEP-$VERSION.aab" > "DOORSTEP-$VERSION.sha256.txt"
          echo "sha256=$(sha256sum "DOORSTEP-$VERSION.apk" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "DOORSTEP-$VERSION.apk")" >> "$GITHUB_OUTPUT"
          # Public certificate fingerprint (not a secret) — Android uses it to trust the app for mydoorstep.com.co.
          fp=$(keytool -list -v -keystore ../android/android.keystore -alias doorstep -storepass "$KS_PW" | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          if [ -z "$fp" ]; then echo "::error::Couldn't read the signing fingerprint. Is the key alias 'doorstep'?"; exit 1; fi
          echo "fingerprint=$fp" >> "$GITHUB_OUTPUT"
          rm -f ../android/android.keystore

      - name: Publish the GitHub Release
        run: |
          gh release create "android-v$VERSION" out/DOORSTEP-$VERSION.apk out/DOORSTEP-$VERSION.aab out/DOORSTEP-$VERSION.sha256.txt \
            --repo "$GITHUB_REPOSITORY" --title "DOORSTEP for Android $VERSION" --notes "$NOTES

          SHA-256 of the APK: ${{ steps.info.outputs.sha256 }}"

      - name: Work out the public download link (and check it works)
        id: link
        run: |
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')
          if [ "$private" = "false" ]; then
            url="https://github.com/$GITHUB_REPOSITORY/releases/download/android-v$VERSION/DOORSTEP-$VERSION.apk"
            ok=""
            for attempt in 1 2 3 4 5 6; do if curl -fsSIL -o /dev/null "$url"; then ok=1; break; fi; sleep 10; done
            if [ -z "$ok" ]; then echo "::error::The GitHub download link doesn't work yet: $url"; exit 1; fi
            echo "hosted=github" >> "$GITHUB_OUTPUT"
          else
            # Private repository: serve the APK from the DOORSTEP website itself (keep only the newest one).
            mkdir -p public/downloads
            find public/downloads -name 'DOORSTEP-*.apk' -delete
            cp "out/DOORSTEP-$VERSION.apk" public/downloads/
            url="/downloads/DOORSTEP-$VERSION.apk"
            echo "hosted=site" >> "$GITHUB_OUTPUT"
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Update the download page data and Android app links
        env:
          URL: ${{ steps.link.outputs.url }}
          HOSTED: ${{ steps.link.outputs.hosted }}
          SHA: ${{ steps.info.outputs.sha256 }}
          SIZE: ${{ steps.info.outputs.size }}
          FP: ${{ steps.info.outputs.fingerprint }}
        run: |
          jq -n --arg version "$VERSION" --argjson code "$VERSION_CODE" --arg url "$URL" --arg hosted "$HOSTED" --arg sha "$SHA" \
            --argjson size "$SIZE" --arg notes "$NOTES" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg release "https://github.com/$GITHUB_REPOSITORY/releases/tag/android-v$VERSION" \
            '{available: true, platform: "android", packageId: "co.com.mydoorstep.app", version: $version, versionCode: $code,
              releasedAt: $date, sizeBytes: $size, sha256: $sha, url: $url, hostedOn: $hosted, releasePage: $release,
              minAndroid: "5.0", notes: $notes}' > public/app-release.json
          # Keep fingerprints already listed (e.g. Google Play's signing key) and add this key's, without duplicates.
          existing=$(jq -c '[.[]? | select(.target.package_name == "co.com.mydoorstep.app") | .target.sha256_cert_fingerprints[]?]' public/assetlinks.json 2>/dev/null || echo '[]')
          jq -n --arg fp "$FP" --argjson old "${existing:-[]}" '[{relation: ["delegate_permission/common.handle_all_urls"],
              target: {namespace: "android_app", package_name: "co.com.mydoorstep.app", sha256_cert_fingerprints: (($old + [$fp]) | unique)}}]' > public/assetlinks.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app-release.json public/assetlinks.json public/downloads 2>/dev/null || git add public/app-release.json public/assetlinks.json
          git commit -m "Android app $VERSION: download page data and app links"
          git push

      - name: What to do next
        run: |
          echo "### DOORSTEP for Android $VERSION is built" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK SHA-256: \`${{ steps.info.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Download link: ${{ steps.link.outputs.url }} (${{ steps.link.outputs.hosted }})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Next: pull the new commit in VS Code and deploy the website, so /download shows this version." >> "$GITHUB_STEP_SUMMARY"
