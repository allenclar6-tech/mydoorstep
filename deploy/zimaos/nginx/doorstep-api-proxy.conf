# Forward to the DOORSTEP API container, including the live-delivery WebSocket (/api/deliveries/:id/live).
# A variable in proxy_pass makes nginx look the name up per request, so it starts even if the API is down.
set $doorstep_api http://api:4000;
proxy_pass $doorstep_api;
proxy_http_version 1.1;

proxy_set_header Host $host;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $doorstep_connection_upgrade;
# Exactly one visitor address: the API trusts one proxy hop and rate-limits by it.
proxy_set_header X-Forwarded-For $doorstep_client_ip;
proxy_set_header X-Real-IP $doorstep_client_ip;
proxy_set_header X-Forwarded-Proto $doorstep_forwarded_proto;
proxy_set_header X-Forwarded-Host $host;

# Riders keep a WebSocket open for a whole delivery.
proxy_read_timeout 3600s;
proxy_send_timeout 3600s;

# The API sets its own security headers (helmet); this line also stops the website's
# Cache-Control and HSTS lines from being added a second time.
add_header Permissions-Policy "geolocation=(self)" always;
