# Headers every website response carries (the same ones the Cloudflare Worker added).
# nginx drops server-level add_header lines inside any location that has its own, so locations include this file.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "geolocation=(self)" always;
add_header X-Content-Type-Options nosniff always;
